services:
  next-app:
    image: registry.tail877c9f.ts.net/vuongdovu-site:latest
    container_name: next-app
    restart: unless-stopped

    expose:
      - "3000"

    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio.tail877c9f.ts.net:8443}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_BUCKET: ${MINIO_BUCKET:-archive-imgs}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt:ro

    depends_on:
      - next-app